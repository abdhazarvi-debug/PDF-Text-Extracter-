name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Fetch OCR language packs
        run: bash scripts/fetch_tessdata.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Text-Extractor-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ GITHUB_RUN_NUMBER }}"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk             --title "PDF Text Extractor $TAG"             --notes "Offline Android APK build ${{ GITHUB_SHA }}"             --latest
